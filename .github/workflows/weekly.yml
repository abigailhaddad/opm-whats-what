name: Weekly OPM what's what

# Mondays 11:00 UTC (6-7am Eastern): collect everything new since last week,
# read it with Claude Opus 5.5 (Message Batches, half price, capped at $3 per
# run), verify every quote, commit the digest, and open an issue so it arrives
# by email.

on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      cap:
        description: "Max estimated cost in USD for this run"
        default: "3"
      check_only:
        description: "Only check that the API key works (no collecting, reading, issue or cost)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # batches usually finish in minutes; the poller gives up at 5 h
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
      # Baseline was taken 2026-11-01; the first scheduled digest is the full week
      # ending Monday 2026-11-09. Scheduled runs before then do nothing.
      FIRST_SCHEDULED_RUN: "2026-11-09"
    steps:
      - name: Skip scheduled runs before the first digest week
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [[ "$(date -u +%F)" < "$FIRST_SCHEDULED_RUN" ]]; then
            echo "Before $FIRST_SCHEDULED_RUN; skipping."; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: ${{ steps.gate.outputs.skip != 'true' }}
      - uses: actions/setup-python@v5
        if: ${{ steps.gate.outputs.skip != 'true' }}
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        if: ${{ steps.gate.outputs.skip != 'true' }}

      - name: Check the API key works (free call; never prints the key)
        if: ${{ steps.gate.outputs.skip != 'true' }}
        run: |
          python - <<'EOF'
          import sys; sys.path.insert(0, "src")
          from read import make_client
          try:
              ids = [m.id for m in make_client().models.list()]
          except Exception as e:
              sys.exit(f"API key missing or not working: {type(e).__name__}")
          assert "claude-opus-5-5" in ids, "claude-opus-5-5 not available to this key"
          print("API key OK")
          EOF

      - name: Collect
        if: ${{ steps.gate.outputs.skip != 'true' && !inputs.check_only }}
        run: python src/collect.py

      - name: Read, verify, write digest
        if: ${{ steps.gate.outputs.skip != 'true' && !inputs.check_only }}
        run: python src/weekly.py --cap "${{ github.event.inputs.cap || '3' }}"

      - name: Independent audit (second extraction of every quote; writes digests/proof/)
        id: audit
        continue-on-error: true   # the digest is still committed and sent; the run is marked failed below
        if: ${{ steps.gate.outputs.skip != 'true' && !inputs.check_only }}
        run: |
          d="digests/$(date -u +%F)"
          [ -f "$d.json" ] && python src/audit.py "$d.json" --append-to "$d.md" || { [ ! -f "$d.json" ]; }

      - name: Commit digest and state
        if: ${{ steps.gate.outputs.skip != 'true' && !inputs.check_only }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/items.json digests/
          git diff --cached --quiet || { git commit -m "Weekly digest $(date -u +%F)"; git pull --rebase -q origin main; git push; }

      - name: Open the digest as an issue (emails you)
        if: ${{ steps.gate.outputs.skip != 'true' && !inputs.check_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="digests/$(date -u +%F).md"
          [ -f "$f" ] || { echo "no digest written"; exit 1; }
          if grep -q '^NOTHING NEW' "$f"; then echo "Nothing new this week; no issue opened."; exit 0; fi
          # a rerun the same day leaves the real digest in place; don't post it a second time
          existing=$(gh issue list --state all --search "in:title $(date -u +%F)" --json title --jq '[.[] | select(.title | startswith("OPM what"))] | length')
          if [ "$existing" -gt 0 ]; then echo "An issue for $(date -u +%F) already exists."; exit 0; fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/$f"
          # issue bodies max out at 65,536 characters; long weeks link to the full file
          python - "$f" "$url" > body.md <<'EOF'
          import sys
          text, url = open(sys.argv[1], encoding="utf-8").read(), sys.argv[2]
          limit = 60000
          if len(text) <= limit:
              print(text)
          else:
              head = text[:limit]
              cut = head.rfind("\n## ")
              head = head[:cut] if cut > 0 else head          # cut between sections, not mid-sentence
              close = "</details>\n" * max(0, head.count("<details") - head.count("</details>"))
              audit = [l for l in text.splitlines() if l.startswith("Independent audit")]   # the audit line must survive
              print(head + "\n" + close + f"\n…truncated. Full digest: {url}\n\n" + "\n".join(audit))
          EOF
          gh issue create --title "OPM what's what — $(date -u +%F)" --body-file body.md --assignee abigailhaddad

      - name: Fail the run if the audit could not confirm every quote
        if: ${{ steps.audit.outcome == 'failure' }}
        run: echo "Audit did not confirm every quote; see digests/proof/. The digest and issue were still published." && exit 1

      # GitHub disables scheduled workflows in a public repo after 60 days with no commits.
      # If the newest commit is 45+ days old, add an empty one on main so the schedule survives.
      - name: Keepalive commit
        if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: |
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "newest commit is $age days old"
          if [ "$age" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keepalive: no commits in $age days"
            git push
          fi
