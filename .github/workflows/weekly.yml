name: Weekly OPM what's what

# Mondays 11:00 UTC (6-7am Eastern): collect everything new since last week,
# read each document with Claude Sonnet 5.5 (Message Batches, half price, capped
# at $3 per run), group the findings into stories with Claude Opus 5.5, verify
# every quote, and commit the digest. The site workflow (triggered by this one
# finishing) publishes it to the site and RSS feed.

on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      cap:
        description: "Max estimated cost in USD for this run"
        default: "3"
      check_only:
        description: "Only check that the API key works (no collecting, reading, or cost)"
        type: boolean
        default: false
      digest_date:
        description: "Digest date YYYY-MM-DD (default: today, UTC). To redo a week's digest after midnight UTC"
        default: ""

permissions:
  contents: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # batches usually finish in minutes; the poller gives up at 5 h
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
      # Baseline was taken 2026-11-01; the first scheduled digest is the full week
      # ending Monday 2026-11-09. Scheduled runs before then do nothing.
      FIRST_SCHEDULED_RUN: "2026-11-09"
    steps:
      - name: Skip scheduled runs before the first digest week
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [[ "$(date -u +%F)" < "$FIRST_SCHEDULED_RUN" ]]; then
            echo "Before $FIRST_SCHEDULED_RUN; skipping."; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Fix the digest date once for the whole run
        if: ${{ steps.gate.outputs.skip != 'true' }}
        env:
          INPUT_DATE: ${{ inputs.digest_date }}
        run: |
          # one date for every step, so a run that crosses midnight UTC doesn't split across two days
          d="${INPUT_DATE:-$(date -u +%F)}"
          [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "digest_date must be YYYY-MM-DD, got: $d"; exit 1; }
          echo "DIGEST_DATE=$d" >> "$GITHUB_ENV"; echo "Digest date: $d"
      - uses: actions/checkout@v4
        if: ${{ steps.gate.outputs.skip != 'true' }}
      - uses: actions/setup-python@v5
        if: ${{ steps.gate.outputs.skip != 'true' }}
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        if: ${{ steps.gate.outputs.skip != 'true' }}

      - name: Check the API key works (free call; never prints the key)
        if: ${{ steps.gate.outputs.skip != 'true' }}
        run: |
          python - <<'EOF'
          import sys; sys.path.insert(0, "src")
          from read import make_client
          try:
              ids = [m.id for m in make_client().models.list()]
          except Exception as e:
              sys.exit(f"API key missing or not working: {type(e).__name__}")
          for m in ("claude-sonnet-5-5", "claude-opus-5-5"):   # reading, grouping
              assert m in ids, f"{m} not available to this key"
          print("API key OK")
          EOF

      - name: Collect
        if: ${{ steps.gate.outputs.skip != 'true' && !inputs.check_only }}
        run: python src/collect.py

      - name: Read, verify, write digest
        if: ${{ steps.gate.outputs.skip != 'true' && !inputs.check_only }}
        run: python src/weekly.py --cap "${{ github.event.inputs.cap || '3' }}"

      - name: Independent audit (second extraction of every quote; writes digests/proof/)
        id: audit
        continue-on-error: true   # a quote the audit can't confirm doesn't fail the run — see the ⚠️ in the digest itself
        if: ${{ steps.gate.outputs.skip != 'true' && !inputs.check_only }}
        run: |
          d="digests/$DIGEST_DATE"
          [ -f "$d.json" ] && python src/audit.py "$d.json" --append-to "$d.md" || { [ ! -f "$d.json" ]; }

      - name: Commit digest and state
        if: ${{ steps.gate.outputs.skip != 'true' && !inputs.check_only }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/items.json digests/
          git diff --cached --quiet || { git commit -m "Weekly digest $DIGEST_DATE"; git pull --rebase -q origin main; git push; }

      # GitHub disables scheduled workflows in a public repo after 60 days with no commits.
      # If the newest commit is 45+ days old, add an empty one on main so the schedule survives.
      - name: Keepalive commit
        if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: |
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "newest commit is $age days old"
          if [ "$age" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keepalive: no commits in $age days"
            git push
          fi
