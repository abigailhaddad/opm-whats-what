name: Website and RSS feed

# Publishes every digest in digests/ as a web page, plus an index and feed.xml (RSS 2.0),
# to GitHub Pages. Runs after each weekly run (whatever its outcome: it publishes what is
# on main), on pushes that change digests/ or the builder, and by hand.
# A push made by the weekly job's GITHUB_TOKEN does not trigger `push`, hence workflow_run.
#
# One-time setup: Settings > Pages > Source: "GitHub Actions".

on:
  workflow_run:
    workflows: ["Weekly OPM what's what"]
    types: [completed]
  push:
    branches: [main]
    paths: ["digests/*.md", "src/build_site.py", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # page dates come from when each digest was first committed

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install markdown-it-py==4.3.0 nh3==0.3.7

      - name: Build the site
        run: |
          python src/build_site.py --out _site \
            --title "OPM what's what" \
            --description "A weekly digest of new documents from OPM (Federal Register, CHCO Council memos, news, reports and publications), summarized by Claude Opus 5.5. A script checks that each quote is in the original on the page cited; it does not check that the findings are right, so read the source. Unofficial; not affiliated with OPM." \
            --site-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" \
            --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          python -c "import xml.etree.ElementTree as ET; ET.parse('_site/feed.xml')"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
